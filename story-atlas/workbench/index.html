<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Story Atlas · 劇情索引</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>

</section></div><p id="status" role="status"></p>
</main><footer>無循環靜態劇情圖 · 保留分支匯合、排除回環；不執行遊戲，條件仍待確認。</footer>
